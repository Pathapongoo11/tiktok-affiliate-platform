version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tiktok_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-tiktok}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tiktok_secret}
      POSTGRES_DB: ${DB_NAME:-tiktok_affiliate}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiktok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tiktok_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tiktok_api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-tiktok}
      - DB_PASSWORD=${DB_PASSWORD:-tiktok_secret}
      - DB_NAME=${DB_NAME:-tiktok_affiliate}
      - REDIS_URL=redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_prod}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      - ENV=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
  redis_data:
