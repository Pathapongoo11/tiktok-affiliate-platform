run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - govet          # Go vet checks
    - errcheck       # Unchecked errors
    - staticcheck    # Static analysis
    - unused         # Unused code
    - gosimple       # Simplification suggestions
    - ineffassign    # Ineffectual assignments
    - typecheck      # Type errors
    - gocyclo        # Cyclomatic complexity
    - misspell       # Spelling mistakes
    - unconvert      # Unnecessary type conversions
    - gocritic       # Various checks

linters-settings:
  gocyclo:
    min-complexity: 15  # Flag functions with complexity > 15

  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - hugeParam          # micro-optimisation; not worth pointer-ifying all request types
      - exitAfterDefer     # log.Fatalf in main() after defer is intentional and common
      - sprintfQuotedString # fires on JSON templates where %q would break the format
      - whyNoLint          # nolint explanations enforced by code review, not CI

issues:
  exclude-rules:
    # Ignore test files for some checks
    - path: _test\.go
      linters:
        - errcheck
        - gocritic

  max-issues-per-linter: 50
  max-same-issues: 5
