name: Frontend CI — TypeScript & Build

on:
  push:
    branches: [develop, main, 'feature/**']
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    branches: [develop, main]
    paths: ['frontend/**']

jobs:
  build:
    name: TypeScript Check & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Build summary
        if: always()
        run: |
          echo "## 🏗️ Frontend Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "frontend/dist" ]; then
            SIZE=$(du -sh frontend/dist | cut -f1)
            echo "✅ Build succeeded — dist size: **$SIZE**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed — dist directory not created" >> $GITHUB_STEP_SUMMARY
          fi
